
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Short AI - Video Clipper</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#090d19;
 color:white;
}
header{
 padding:20px;
 border-bottom:1px solid #252c40;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{font-size:25px;font-weight:bold;color:#9b8cff}
.logo span{color:white}
.badge{
 background:#172b25;
 color:#49dba0;
 padding:8px 12px;
 border-radius:20px;
 font-size:12px;
}
main{
 max-width:850px;
 margin:55px auto;
 padding:20px;
 text-align:center;
}
h1{font-size:38px}
h1 span{color:#9b8cff}
.sub{color:#aab2c5;line-height:1.6}
.panel{
 background:#141b2d;
 border:1px solid #29334b;
 border-radius:18px;
 padding:25px;
 margin-top:30px;
 text-align:left;
}
.upload{
 border:2px dashed #6257a7;
 padding:35px 15px;
 border-radius:15px;
 text-align:center;
 cursor:pointer;
}
.upload h3{margin:10px}
input,select{
 width:100%;
 padding:14px;
 margin-top:12px;
 background:#0b1120;
 border:1px solid #343e55;
 border-radius:9px;
 color:white;
}
button{
 width:100%;
 padding:15px;
 margin-top:18px;
 border:0;
 border-radius:10px;
 background:linear-gradient(90deg,#7865ff,#a35cff);
 color:white;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}
button:hover{opacity:.9}
label{display:block;margin-top:18px;color:#c6cce0}
#preview{
 width:100%;
 max-height:350px;
 margin-top:15px;
 display:none;
 border-radius:12px;
}
footer{
 text-align:center;
 padding:30px;
 color:#778198;
 font-size:13px;
}
@media(max-width:600px){
 h1{font-size:30px}
 main{margin:25px auto}
 .panel{padding:17px}
}
</style>
</head>
<body>

<header>
 <div class="logo">Short <span>AI.</span></div>
 <div class="badge">FREE VERSION</div>
</header>

<main>
 <h1>Turn Long Videos Into <span>Shorts</span></h1>
 <p class="sub">
 Create vertical videos for YouTube Shorts,
 Instagram Reels and TikTok.
 </p>

 <div class="panel">
  <h2>Upload Your Video</h2>

  <div class="upload"
  onclick="document.getElementById('video').click()">
   <div style="font-size:40px">📹</div>
   <h3>Click to Upload Video</h3>
   <p class="sub">Select a video from your device</p>
   <input type="file" id="video"
   accept="video/*" hidden onchange="showVideo(event)">
  </div>

  <video id="preview" controls></video>

  <label>YouTube Video URL</label>
  <input type="url" id="youtube"
  placeholder="Paste YouTube video link">

  <label>Clip Duration</label>
  <select id="duration">
   <option>30 Seconds</option>
   <option>45 Seconds</option>
   <option>60 Seconds</option>
   <option>90 Seconds</option>
  </select>

  <label>Video Format</label>
  <select>
   <option>9:16 Vertical Shorts</option>
   <option>16:9 Landscape</option>
   <option>1:1 Square</option>
  </select>

  <label>Subtitles</label>
  <select>
   <option>Auto Captions ON</option>
   <option>Auto Captions OFF</option>
  </select>

  <button onclick="generate()">
   ✨ Generate AI Clips
  </button>

  <p id="message" style="color:#aab2c5;text-align:center"></p>
 </div>

 <p class="sub">
  Made with ❤️ by Short AI
 </p>
</main>

<footer>
 © 2026 Short AI. All Rights Reserved.
</footer>

<script>
function showVideo(event){
 const file=event.target.files[0];
 if(!file)return;
 const preview=document.getElementById('preview');
 preview.src=URL.createObjectURL(file);
 preview.style.display='block';
}
function generate(){
 const file=document.getElementById('video').files[0];
 const link=document.getElementById('youtube').value;
 const message=document.getElementById('message');
 if(!file&&!link){
  message.innerText="Please upload a video or enter a link.";
  return;
 }
 message.innerText="Frontend demo ready! AI processing will be connected in the next version.";
}
</script>

</body>
</html>
